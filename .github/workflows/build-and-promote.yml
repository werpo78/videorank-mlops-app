name: build-and-promote

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  IMAGE_NAME: videorank-api
  CONFIG_REPO: videorank-mlops-config
  CONFIG_VALUES_PATH: apps/videorank-api/overlays/dev/values.yaml

jobs:
  build-push-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          SORTABLE_TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          REPOSITORY="${REGION}-docker.pkg.dev/${PROJECT_ID}/videorank/${IMAGE_NAME}"
          IMAGE_SHA="${REPOSITORY}:${GITHUB_SHA}"
          IMAGE_SORTABLE="${REPOSITORY}:${SORTABLE_TAG}"
          docker build -t "${IMAGE_SHA}" -t "${IMAGE_SORTABLE}" .
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_SORTABLE}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_SHA}" --format='value(image_summary.digest)')"
          echo "repository=${REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "tag=${SORTABLE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "image=${REPOSITORY}@${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Cloud Run dev service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy videorank-api \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.image }}" \
            --service-account="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars="VIDEORANK_ENV=dev,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GCP_REGION=${REGION},VIDEORANK_BQ_DATASET=videorank" \
            --quiet

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config-repo

      - name: Update GitOps image digest
        working-directory: config-repo
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["CONFIG_VALUES_PATH"])
          updates = {
              "repository": os.environ["IMAGE_REPOSITORY"],
              "tag": os.environ["IMAGE_TAG"],
              "digest": os.environ["IMAGE_DIGEST"],
          }

          def replace_value(line: str, value: str) -> str:
              prefix, sep, comment = line.partition("#")
              indent = prefix[: len(prefix) - len(prefix.lstrip())]
              key = prefix.strip().split(":", 1)[0]
              suffix = f" # {comment.strip()}" if sep else ""
              return f"{indent}{key}: {value}{suffix}"

          rendered = []
          for line in path.read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              key = stripped.split(":", 1)[0] if ":" in stripped else ""
              if key in updates:
                  rendered.append(replace_value(line, updates[key]))
              else:
                  rendered.append(line)
          path.write_text("\n".join(rendered) + "\n", encoding="utf-8")
          PY

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: config-repo
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          branch: promote/videorank-${{ github.sha }}
          title: "Promote videorank-api ${{ github.sha }}"
          body: |
            Promote immutable image built from app commit `${{ github.sha }}`.

            Image: `${{ steps.image.outputs.image }}`
            Sortable tag for Flux ImagePolicy: `${{ steps.image.outputs.tag }}`
          commit-message: "Promote videorank-api ${{ github.sha }}"
